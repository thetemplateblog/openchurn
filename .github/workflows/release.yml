# Tag a version (git tag v1.0.1 && git push --tags) to publish @openchurn/planner and openchurn to npm and attach
# openchurn.html to a GitHub Release. Publishing uses npm Trusted Publishing: each package on npmjs.com trusts this
# repo's release.yml, so there is no npm token.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11.21.1
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Skips a version already on npm (1.0.0 was published by hand, before Trusted Publishing could be set up).
      - run: |
          v=$(node -p "require('./packages/planner/package.json').version")
          if npm view "@openchurn/planner@$v" version >/dev/null 2>&1; then echo "@openchurn/planner@$v is already on npm"; else npm publish -w @openchurn/planner --access public --provenance; fi
      # Skips a version already on npm (1.0.0 was published by hand, before Trusted Publishing could be set up).
      - run: |
          v=$(node -p "require('./cli/package.json').version")
          if npm view "openchurn@$v" version >/dev/null 2>&1; then echo "openchurn@$v is already on npm"; else npm publish -w openchurn --access public --provenance; fi
      - run: gh release create "$GITHUB_REF_NAME" app/dist-single/openchurn.html --title "OpenChurn $GITHUB_REF_NAME" --generate-notes || gh release upload "$GITHUB_REF_NAME" app/dist-single/openchurn.html --clobber
        env:
          GH_TOKEN: ${{ github.token }}
